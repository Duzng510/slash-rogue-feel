<!doctype html>
<!-- Throwaway gate probe for the WebGL2 renderer migration. NOT shipped.
     Proves a #version 300 es shader can compile+link and that the rasterized
     result reaches the canvas backing store (=> Page.captureScreenshot will see it)
     under the headless Chrome flags we plan to switch the capture harnesses to. -->
<html>
  <head><meta charset="utf-8"><title>gl-probe</title></head>
  <body style="margin:0;background:#000">
    <script>
      (async () => {
        const out = {
          webgl2: false, shaderLink: false, shaderErr: '',
          readPixels: null, drawnPixel: null,
          glVersion: null, glRenderer: null, verdict: 'init',
        };
        const canvas = document.createElement('canvas');
        canvas.width = 320; canvas.height = 180;
        canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated';
        document.body.appendChild(canvas);

        const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true });
        out.webgl2 = !!gl;
        if (!gl) {
          out.verdict = 'FAIL';
          window.__result = out; window.__done = true; return;
        }
        out.glVersion = gl.getParameter(gl.VERSION);
        out.glRenderer = gl.getParameter(gl.RENDERER);

        const vsSrc = `#version 300 es
          void main(){ vec2 v[3]; v[0]=vec2(-1.,-1.); v[1]=vec2(3.,-1.); v[2]=vec2(-1.,3.);
          gl_Position = vec4(v[gl_VertexID], 0., 1.); }`;
        const fsSrc = `#version 300 es
          precision mediump float; out vec4 o; void main(){ o = vec4(1., 0., 1., 1.); }`;

        const compile = (type, src) => {
          const s = gl.createShader(type);
          gl.shaderSource(s, src); gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
          return s;
        };

        try {
          const p = gl.createProgram();
          gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
          gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
          gl.linkProgram(p);
          out.shaderLink = gl.getProgramParameter(p, gl.LINK_STATUS);
          if (!out.shaderLink) {
            out.shaderErr = gl.getProgramInfoLog(p); out.verdict = 'FAIL';
            window.__result = out; window.__done = true; return;
          }
          gl.useProgram(p);
          gl.viewport(0, 0, 320, 180);
          gl.clearColor(1, 0, 1, 1);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          gl.finish();

          const px = new Uint8Array(4);
          gl.readPixels(160, 90, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
          out.readPixels = Array.from(px);

          // let the compositor present, then read the canvas back through a 2D copy
          await new Promise((r) => requestAnimationFrame(r));
          await new Promise((r) => requestAnimationFrame(r));
          const c2 = document.createElement('canvas');
          c2.width = 320; c2.height = 180;
          const x = c2.getContext('2d');
          x.drawImage(canvas, 0, 0);
          out.drawnPixel = Array.from(x.getImageData(160, 90, 1, 1).data);

          const rp = out.readPixels, dp = out.drawnPixel;
          const magenta = (a) => a && a[0] > 200 && a[1] < 60 && a[2] > 200;
          out.verdict =
            (out.webgl2 && out.shaderLink && magenta(rp) && magenta(dp)) ? 'PASS'
            : (magenta(rp) && !magenta(dp)) ? 'RASTER_OK_BUT_NOT_PRESENT'
            : 'FAIL';
        } catch (e) {
          out.shaderErr = String((e && e.message) || e);
          out.verdict = 'FAIL';
        }
        window.__result = out; window.__done = true;
      })();
    </script>
  </body>
</html>
